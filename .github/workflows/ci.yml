name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build & test (JDK 21)
    runs-on: ubuntu-latest
    env:
      # Dummy values so the Spring context can start in tests - no real model calls are made.
      XAI_API_KEY: ci-dummy-key
      API_KEY: ci-dummy-key
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ci-dummy
      AWS_SECRET_ACCESS_KEY: ci-dummy
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Testcontainers uses the Docker daemon that ships with GitHub-hosted runners
      - name: Build and run tests
        run: mvn -B -ntp verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports

spring:
  application:
    name: internal-rag-core-service

  threads:
    virtual:
      enabled: true

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:rag_core}
    username: ${DB_USERNAME:rag_core}
    password: ${DB_PASSWORD:rag_core}
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:10}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  ai:
    model:
      chat: openai
      embedding: bedrock-titan
    openai:
      base-url: ${XAI_BASE_URL:https://api.x.ai}
      api-key: ${XAI_API_KEY:}
      chat:
        options:
          model: ${XAI_CHAT_MODEL_ID:grok-4.6}
          temperature: 0.3
          max-tokens: 1024
    bedrock:
      aws:
        region: ${AWS_REGION:us-east-1}
      titan:
        embedding:
          model: ${BEDROCK_EMBEDDING_MODEL_ID:amazon.titan-embed-text-v2:0}
          input-type: text
    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 1024
        distance-type: cosine-distance
        index-type: hnsw

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

app:
  security:
    api-key: ${API_KEY:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  ingestion:
    chunk-size-tokens: ${CHUNK_SIZE_TOKENS:800}
    min-chunk-size-chars: ${MIN_CHUNK_SIZE_CHARS:350}
  rag:
    top-k: ${RAG_TOP_K:5}
    similarity-threshold: ${RAG_SIMILARITY_THRESHOLD:0.5}

logging:
  level:
    root: INFO
    com.internal.internal_rag_core_service: INFO
